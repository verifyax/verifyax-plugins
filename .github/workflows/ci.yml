name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate manifests and version consistency
        run: node scripts/check-manifests.mjs

      - name: Shellcheck build scripts
        # severity=error for the initial gate (catches real bugs without blocking
        # on style warnings); tighten to the default once the scripts are clean.
        run: shellcheck --severity=error scripts/*.sh plugins/verifyax-claude-agent/sandbox/*.sh

      - name: Build and verify the .skill bundle
        run: |
          bash scripts/build-skill.sh verifyax-api
          test -f dist/verifyax-api.skill || { echo "bundle was not produced"; exit 1; }
          # Exactly one top-level entry, named after the skill, containing SKILL.md.
          top=$(unzip -Z1 dist/verifyax-api.skill | cut -d/ -f1 | sort -u)
          [ "$top" = "verifyax-api" ] || { echo "unexpected top-level entry: [$top]"; exit 1; }
          unzip -Z1 dist/verifyax-api.skill | grep -qx "verifyax-api/SKILL.md" \
            || { echo "verifyax-api/SKILL.md missing from the bundle"; exit 1; }
          echo "bundle OK"

  claude-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: plugins/verifyax-claude-agent/adapter/requirements.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install locked Python runtime
        run: |
          python -m pip install --require-hashes \
            -r plugins/verifyax-claude-agent/adapter/requirements.lock

      - name: Import, compile, and test executable plugin
        env:
          PYTHONPATH: plugins/verifyax-claude-agent/adapter
        run: |
          python -m compileall -q \
            plugins/verifyax-claude-agent/adapter \
            plugins/verifyax-claude-agent/scripts/tunnel.py
          python -m unittest discover \
            -s plugins/verifyax-claude-agent/adapter/tests -v

      - name: Verify pinned Claude Code tools-off capability
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.263
          export PATH="$(npm prefix -g)/bin:$PATH"
          npm ls -g --depth=0 @anthropic-ai/claude-code@2.1.263
          version=$(claude --version)
          echo "claude --version: ${version}"
          echo "$version" | grep -F '2.1.263'
          # --help wraps this across two lines: 'Use "" to disable all' / 'tools, ...'
          claude --help | grep -F 'Use "" to disable all'

      - name: Validate pinned sandbox definition
        run: docker build --check -f plugins/verifyax-claude-agent/sandbox/Dockerfile plugins/verifyax-claude-agent
